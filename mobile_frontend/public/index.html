<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    
    <!-- Responsive Viewport for All Mobile Devices & Browsers (iOS Safari, Android Chrome, Edge, Firefox) -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, viewport-fit=cover, shrink-to-fit=no" 
    />
    
    <!-- Primary Search Engine SEO Meta Tags (Google, Bing, Yahoo, DuckDuckGo) -->
    <title>Cricket Federation of Virudhunagar District | Official Live Scores & Fixtures</title>
    <meta 
      name="description" 
      content="Official Cricket Federation Portal: Real-time ball-by-ball scorecards, tournament fixtures, player stats, team registries, and responsive wagon wheel analytics across all devices." 
    />
    <meta 
      name="keywords" 
      content="cricket federation, live cricket score, cricket fixtures, wagon wheel, ball by ball scorecard, virudhunagar cricket league, tournament schedule, scorer app, TNCA cricket" 
    />
    <meta name="author" content="Cricket Federation of Virudhunagar District" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="color-scheme" content="dark light" />

    <!-- Browser Tab Theme Colors (Chrome, Edge, Safari, Android) -->
    <meta name="theme-color" content="#020612" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#020612" media="(prefers-color-scheme: light)" />

    <!-- Apple WebKit & iOS Safari Enhancements -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cricket Fed" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <meta name="apple-touch-fullscreen" content="yes" />

    <!-- Android Chrome Web App Enhancements -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Cricket Federation" />

    <!-- Social Media & Search Engine Open Graph (OG) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cricket Federation of Virudhunagar District" />
    <meta property="og:title" content="Cricket Federation | Live Scores, Fixtures & Wagon Wheel Analytics" />
    <meta property="og:description" content="Follow real-time ball-by-ball cricket matches, team rosters, tournament fixtures, and detailed wagon wheel analytics on all devices." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cricket Federation of Virudhunagar District" />
    <meta name="twitter:description" content="Official cricket portal featuring live scorecards, tournament fixtures, and wagon wheel analytics." />

    <!-- Structured Data JSON-LD for Google & Search Engine Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SportsOrganization",
      "name": "Cricket Federation of Virudhunagar District",
      "sport": "Cricket",
      "description": "Governing district cricket body organizing official leagues, tournaments, player registrations, and live scoring.",
      "event": {
        "@type": "SportsEvent",
        "name": "Virudhunagar Premier League 2026",
        "sport": "Cricket",
        "eventStatus": "https://schema.org/EventScheduled"
      }
    }
    </script>

    <!-- Cross-Engine CSS Standards (Blink, WebKit, Gecko) -->
    <style>
      /* CSS Reset & Modern Dynamic Viewport Standards */
      *, *::before, *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #020612;
        /* Prevent font size inflation on mobile Safari when orientation changes */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        /* Cross-browser high quality text rendering */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      body {
        width: 100%;
        min-height: 100%;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
        background-color: #020612;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        overflow-x: hidden;
        /* Smooth native touch momentum scrolling for iOS Safari */
        -webkit-overflow-scrolling: touch;
      }

      /* iOS Notch / Dynamic Island Safe Area Inset Support */
      @supports (padding: env(safe-area-inset-top)) {
        body {
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }

      /* Root Container Scaling */
      #root {
        display: flex;
        flex-direction: column;
        flex: 1;
        width: 100%;
        min-height: 100%;
        min-height: 100dvh;
        max-width: 100vw;
        overflow-x: hidden;
      }

      /* Fix iOS Safari auto-zoom behavior on form inputs */
      input, select, textarea {
        font-size: 16px;
      }

      /* Custom Modern Scrollbar across Chrome, Edge, Safari, Firefox */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #020612;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #334155;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: #1e293b #020612;
      }

      /* SweetAlert2 Cricket Association Custom Theme (Pure White Background) */
      .swal2-container {
        z-index: 9999999 !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
      }
      .swal2-popup.cric-swal-popup,
      .swal2-popup {
        border-radius: 18px !important;
        background: #ffffff !important;
        color: #0f172a !important;
        border: 1px solid rgba(226, 232, 240, 0.9) !important;
        box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.25) !important;
        padding: 24px !important;
      }
      .swal2-title.cric-swal-title,
      .swal2-title {
        color: #0f172a !important;
        font-size: 20px !important;
        font-weight: 700 !important;
        letter-spacing: 0.2px !important;
        margin-bottom: 8px !important;
      }
      .swal2-html-container.cric-swal-text,
      .swal2-html-container {
        color: #334155 !important;
        font-size: 14px !important;
        line-height: 1.6 !important;
      }
      .cric-swal-confirm-btn,
      .swal2-confirm {
        background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%) !important;
        color: #020612 !important;
        font-weight: 700 !important;
        font-size: 14px !important;
        border-radius: 10px !important;
        padding: 10px 24px !important;
        border: none !important;
        box-shadow: 0 4px 14px rgba(234, 179, 8, 0.35) !important;
        cursor: pointer !important;
        transition: all 0.2s ease !important;
      }
      .cric-swal-confirm-btn:hover,
      .swal2-confirm:hover {
        transform: translateY(-1px) !important;
        box-shadow: 0 6px 18px rgba(234, 179, 8, 0.5) !important;
      }
      .cric-swal-cancel-btn,
      .swal2-cancel {
        background: #f1f5f9 !important;
        color: #475569 !important;
        font-weight: 600 !important;
        font-size: 14px !important;
        border-radius: 10px !important;
        padding: 10px 20px !important;
        border: 1px solid #cbd5e1 !important;
        cursor: pointer !important;
        transition: all 0.2s ease !important;
      }
      .cric-swal-cancel-btn:hover,
      .swal2-cancel:hover {
        background: #e2e8f0 !important;
        color: #1e293b !important;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; color: #fff; background: #020612;">
        JavaScript is required to view live cricket scores and fixtures. Please enable JavaScript to continue.
      </div>
    </noscript>
    <div id="root"></div>
  </body>
</html>
