      /* ============================================================ */
      /* CINEMATIC PRELOADER & GRAND WEBSITE ENTRANCE ANIMATIONS     */
      /* ============================================================ */
      body.cfvd-preloader-active {
        overflow: hidden;
      }

      body.cfvd-preloader-active #root {
        opacity: 0;
        pointer-events: none;
      }

      /* Grand Website Entrance Animation upon Video Completion */
      #root.cfvd-revealing {
        opacity: 1 !important;
        transform: scale(1) translateY(0) !important;
        filter: blur(0px) brightness(1) !important;
        pointer-events: auto !important;
        transition: transform 1.25s cubic-bezier(0.16, 1, 0.3, 1),
                    opacity 1.05s cubic-bezier(0.16, 1, 0.3, 1),
                    filter 1.05s cubic-bezier(0.16, 1, 0.3, 1) !important;
        will-change: transform, opacity, filter;
      }

      /* Stadium Floodlight Burst Flash */
      #cfvd-stadium-flash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: radial-gradient(circle at 50% 45%, rgba(251, 191, 36, 0.95) 0%, rgba(245, 158, 11, 0.6) 35%, rgba(2, 6, 18, 0) 75%),
                    linear-gradient(135deg, rgba(255, 255, 255, 0.7) 0%, rgba(245, 158, 11, 0) 55%);
        pointer-events: none;
        z-index: 2147483646;
        opacity: 0;
        visibility: hidden;
        mix-blend-mode: screen;
      }

      #cfvd-stadium-flash.active {
        visibility: visible;
        animation: cfvdFlashAnimation 1.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes cfvdFlashAnimation {
        0% {
          opacity: 0;
          transform: scale(0.9);
        }
        25% {
          opacity: 0.95;
          transform: scale(1.05);
        }
        100% {
          opacity: 0;
          transform: scale(1.3);
          visibility: hidden;
        }
      }

      /* Audio Equalizer Pulsing Waves */
      @keyframes cfvdSoundWave1 {
        0%, 100% { height: 4px; }
        50% { height: 14px; }
      }
      @keyframes cfvdSoundWave2 {
        0%, 100% { height: 14px; }
        50% { height: 5px; }
      }
      @keyframes cfvdSoundWave3 {
        0%, 100% { height: 7px; }
        50% { height: 16px; }
      }

      @keyframes cfvdPromptPulse {
        0%, 100% {
          transform: translateX(-50%) scale(1);
          box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4), inset 0 0 10px rgba(245, 158, 11, 0.2);
        }
        50% {
          transform: translateX(-50%) scale(1.04);
          box-shadow: 0 6px 30px rgba(245, 158, 11, 0.8), inset 0 0 18px rgba(245, 158, 11, 0.4);
        }
      }

      /* Full Responsive Screen Video Coverage - Zero Hidden Content */
      #cfvd-preloader-video {
        width: 100% !important;
        height: 100% !important;
        max-width: 100vw !important;
        max-height: 100vh !important;
        max-height: 100dvh !important;
        object-fit: contain !important;
        object-position: center center !important;
        background-color: transparent !important;
      }

      @media (max-width: 768px), (orientation: portrait), (max-aspect-ratio: 1/1) {
        #cfvd-preloader-video {
          width: 100% !important;
          height: 100% !important;
          max-width: 100vw !important;
          max-height: 100vh !important;
          max-height: 100dvh !important;
          object-fit: contain !important;
          object-position: center center !important;
        }
      }
      /* Main Video Responsive Sizing: Full-screen cover in landscape, full-view contain in portrait */
      #cfvd-preloader-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        max-width: 100vw;
        max-height: 100vh;

      }

      @media (max-aspect-ratio: 1/1) {
        #cfvd-preloader-video {
          object-fit: contain;
        }
      }
    </style>

  <body class="cfvd-preloader-active">

      style="

        <!-- Progress Bar Track -->
        <div style="

        ">
          <div id="cfvd-preloader-progress" style="

    <script>
      (function() {
        var preloader = document.getElementById('cfvd-preloader-root');
        var video = document.getElementById('cfvd-preloader-video');
        var skipBtn = document.getElementById('cfvd-skip-btn');
        var soundHint = document.getElementById('cfvd-tap-sound-hint');
        var progressBar = document.getElementById('cfvd-preloader-progress');
        var stadiumFlash = document.getElementById('cfvd-stadium-flash');

        if (!preloader || !video) return;

        // Check if user already saw the preloader in this session
        var hasSeen = false;
        try {
          hasSeen = Boolean(sessionStorage.getItem('cfvd_preloader_seen'));
        } catch(e) {}

        var dismissed = false;
        window.__dismissCfvdPreloader = function(immediate) {
          if (dismissed) return;
          dismissed = true;
          try {
            sessionStorage.setItem('cfvd_preloader_seen', 'true');
          } catch(e) {}

          var root = document.getElementById('root');
          var flash = document.getElementById('cfvd-stadium-flash');

          // Pause video immediately
          try {
            if (video) video.pause();
            var backdrop = document.getElementById('cfvd-preloader-backdrop');
            if (backdrop) backdrop.pause();
          } catch(e) {}

          // Immediately unlock body scroll
          document.body.classList.remove('cfvd-preloader-active');
          if (root) {
            root.classList.add('cfvd-revealing');
          }

          if (immediate) {
            if (root) {
              root.style.opacity = '1';
              root.style.transform = 'none';
              root.style.filter = 'none';
              root.style.pointerEvents = 'auto';
            }
            if (preloader && preloader.parentNode) {
              preloader.parentNode.removeChild(preloader);
            }
            if (flash && flash.parentNode) {
              flash.parentNode.removeChild(flash);
            }
            return;
          }

          // 1. Trigger Golden Stadium Floodlight Flash Flare
          if (flash) {
            flash.classList.add('active');
          }

          // 2. Cinematic Preloader Forward Zoom & Depth Blur Dissolve
          if (preloader) {
            preloader.style.transition = 'opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), filter 0.65s cubic-bezier(0.16, 1, 0.3, 1)';
            preloader.style.opacity = '0';
            preloader.style.transform = 'scale(1.12)';
            preloader.style.filter = 'blur(14px)';
            preloader.style.pointerEvents = 'none';
          }

          setTimeout(function() {
            if (preloader && preloader.parentNode) {
              preloader.parentNode.removeChild(preloader);
            }
            if (flash && flash.parentNode) {
              flash.parentNode.removeChild(flash);
            }
          }, 650);
        };

        if (hasSeen) {
          window.__dismissCfvdPreloader(true);
          return;
        }

        function triggerPreloaderSkip(e) {
          if (e) {
            try { e.stopPropagation(); } catch(_e) {}
            try { e.preventDefault(); } catch(_e) {}
          }
          window.__dismissCfvdPreloader(false);
        }

        if (skipBtn) {
          skipBtn.addEventListener('click', triggerPreloaderSkip, { passive: false });
          skipBtn.addEventListener('touchend', triggerPreloaderSkip, { passive: false });
          skipBtn.addEventListener('touchstart', triggerPreloaderSkip, { passive: false });
          skipBtn.addEventListener('pointerup', triggerPreloaderSkip, { passive: false });
        }

        window.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') {
            window.__dismissCfvdPreloader(false);
          }
        });

        // ============================================================
        // SOUND ENGINE: GUARANTEED MOBILE & WEB UNMUTED STADIUM AUDIO
        // ============================================================
        var soundBadge = document.getElementById('cfvd-sound-badge');
        var soundStatusText = document.getElementById('cfvd-sound-status-text');

        function forceEnableStadiumAudio() {
          try {
            video.muted = false;
            video.volume = 1.0;
            var p = video.play();
            if (p !== undefined) {
              p.catch(function(e) {
                console.warn('[CFVD Audio] Retry play error:', e);
              });
            }
          } catch(e) {}
          if (soundHint) soundHint.style.display = 'none';
          if (soundStatusText) soundStatusText.textContent = 'SOUND ON';
          if (soundBadge) {
            soundBadge.style.borderColor = 'rgba(245, 158, 11, 0.9)';
            soundBadge.style.background = 'rgba(245, 158, 11, 0.28)';
          }
        }

        if (soundBadge) {
          soundBadge.style.cursor = 'pointer';
          soundBadge.addEventListener('click', forceEnableStadiumAudio);
          soundBadge.addEventListener('touchend', forceEnableStadiumAudio);
        }

        // Global touch & click listener for mobile devices to unmute on first gesture
        var gestureEvents = ['touchstart', 'touchend', 'click', 'pointerdown', 'keydown'];
        function handleUserGesture() {
          forceEnableStadiumAudio();
          gestureEvents.forEach(function(evt) {
            window.removeEventListener(evt, handleUserGesture, true);
          });
        }
        gestureEvents.forEach(function(evt) {
          window.addEventListener(evt, handleUserGesture, { capture: true, once: true });
        });

        // Also tapping the preloader video directly un-mutes audio on mobile
        preloader.addEventListener('touchstart', handleUserGesture, { passive: true, once: true });
        preloader.addEventListener('click', handleUserGesture, { passive: true, once: true });

        if (soundHint) {
          soundHint.addEventListener('click', function(e) {
            e.stopPropagation();
            forceEnableStadiumAudio();
          });
          soundHint.addEventListener('touchend', function(e) {
            e.stopPropagation();
            forceEnableStadiumAudio();
          });
        }

        // Attempt initial unmuted play
        video.muted = false;
        video.volume = 1.0;
        var playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(function(err) {
            // Mobile browser policy restricted sound before first touch: play muted temporarily and display activation hint
            console.warn('[CFVD Preloader] Autoplay audio waiting for mobile gesture:', err);
            video.muted = true;
            video.play().then(function() {
              if (soundHint) soundHint.style.display = 'block';
              if (soundStatusText) soundStatusText.textContent = 'TAP FOR SOUND';
            }).catch(function() {});
          });
        }

        // ============================================================
        // BAIL LOCK AUDIO SYNC: AT ~6.9s WHEN THE BAILS FIX INTO PLACE
        // WITH THE CLACK SOUND, THE WEBSITE LOCKS INTO POSITION!
        // ============================================================
        var transitionTriggered = false;
        video.addEventListener('timeupdate', function() {
          if (video.duration && progressBar) {
            var pct = (video.currentTime / video.duration) * 100;
            progressBar.style.width = Math.min(100, pct) + '%';
          }
        });

        video.addEventListener('ended', function() {
          if (!transitionTriggered) {
            transitionTriggered = true;
            window.__dismissCfvdPreloader(false);
          }
        });

        video.addEventListener('error', function() {
          if (!transitionTriggered) {
            transitionTriggered = true;
            window.__dismissCfvdPreloader(true);
          }
        });

        // Safety fallback timeout after 10.5s
        setTimeout(function() {
          if (!transitionTriggered) {
            transitionTriggered = true;
            window.__dismissCfvdPreloader(false);
          }
        }, 10500);
      })();
    </script>

    <div id="root"></div>
  </body>
