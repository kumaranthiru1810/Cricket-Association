name: CI - Test & Build Verification

on:
  push:
    branches: [ main, scorer ]
  pull_request:
    branches: [ main, scorer ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Test Suite (46 Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Automated Backend Tests
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URI: mongodb://127.0.0.1:27017/cricket_db
          JWT_SECRET: test_jwt_secret_token_key_ci
        run: npm test

  frontend-check:
    name: Frontend TypeScript Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile_frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: mobile_frontend
        run: npm ci

      - name: Typecheck Frontend
        working-directory: mobile_frontend
        run: npx tsc --noEmit

  docker-verification:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [ backend-test, frontend-check ]
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: cricket-backend:ci-check

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./mobile_frontend
          file: ./mobile_frontend/Dockerfile
          push: false
          tags: cricket-frontend:ci-check

